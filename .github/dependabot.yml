version: 2

# Weekly bumps for the two ecosystems this repository actually resolves from.
#
# The workflow file pins every action to a commit SHA rather than a tag, which is
# the right default and also means nothing updates those pins by hand. Dependabot
# is therefore not a convenience here: without it the pins rot, and with a tag
# nobody would notice that a tag had moved.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
